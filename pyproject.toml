[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trimblex9-mcp"
version = "0.16.0"
description = "MCP server for the Trimble X9 laser scanner's local HTTP API (read-only by default)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Works with the mcp 1.x (FastMCP) and 2.x (MCPServer) APIs.
    "mcp>=1.7,<3",
    "httpx>=0.27",
]
keywords = ["mcp", "model-context-protocol", "lidar", "laser-scanner", "point-cloud", "trimble"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
trimblex9-mcp = "scanner_mcp:main"

[project.urls]
Repository = "https://github.com/northidaholabs/TrimbleX9-mcp"

[tool.setuptools]
py-modules = ["scanner_mcp", "scanner_bridge"]

[tool.ruff.lint]
# ruff's default rules, minus four patterns this code uses on purpose.
ignore = [
    "BLE001",   # A progress report or capability probe must never fail a tool call, whatever it raises.
    "S110",     # Same: those handlers pass on purpose.
    "ASYNC230", # Downloads write each received chunk to a local file; the writes are small and ordered.
    "SIM117",   # The stream is nested under its client so the order of closing reads plainly.
]
