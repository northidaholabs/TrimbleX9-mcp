name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The floor in pyproject.toml. mcp 1.7 imports a private pydantic
          # helper that pydantic 2.14 removed, so pin pydantic with it.
          - python-version: "3.10"
            mcp: '"mcp==1.7.*" "pydantic<2.14"'
          - python-version: "3.10"
            mcp: '"mcp>=1.7,<2"'
          - python-version: "3.13"
            mcp: '"mcp>=2,<3"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest coverage ${{ matrix.mcp }}
      - name: Entry point
        run: command -v trimblex9-mcp
      - name: Bridge for the bridge-mode tests
        # A released bridge and the recipe from the same tag. Raise BRIDGE_TAG with each bridge release.
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: v0.15.0
        run: |
          mkdir -p "$RUNNER_TEMP/bridge" && cd "$RUNNER_TEMP/bridge"
          gh release download "$BRIDGE_TAG" -R northidaholabs/trimble-x9-bridge --pattern "*x86_64-unknown-linux-gnu.tar.gz*"
          sha256sum -c ./*.sha256
          tar -xzf ./*.tar.gz
          gh api "repos/northidaholabs/trimble-x9-bridge/contents/crates/x9-bridge/tests/recipes/window-measurement.toml?ref=$BRIDGE_TAG" \
            -H "Accept: application/vnd.github.raw" > window-measurement.toml
          echo "X9_BRIDGE_BIN=$PWD/trimble-x9-bridge-$BRIDGE_TAG-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
          echo "X9_RECIPE=$PWD/window-measurement.toml" >> "$GITHUB_ENV"
      - name: Tests, with coverage
        run: coverage run --source=. --omit='tests/*' -m pytest -q -rs
      - name: Coverage
        run: coverage report -m --fail-under=93
      - name: Lint
        # Pinned: a new ruff release can add default rules. Raise it on purpose.
        run: pip install ruff==0.17.4 && ruff check .
